name: Generate Metrics

# Renders GitHub stats as SVGs and commits them into this repo, so the README
# never depends on a third-party Vercel instance staying online.
#
# SETUP (one time):
#   1. Create a classic PAT at https://github.com/settings/tokens
#      Scope: read:user   (add repo    if you also want private-repo stats)
#   2. Add it as a repository secret named METRICS_TOKEN
#      Settings → Secrets and variables → Actions → New repository secret
#   3. Run this workflow once from the Actions tab (Run workflow)

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours, same cadence as the snake
  workflow_dispatch:          # Manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Overview — activity, community & repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: masud90895
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
          committer_message: "chore(metrics): update overview [skip ci]"
          extras_css: |
            svg { background-color: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            a, .link { color: #58a6ff; }

      - name: Languages breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: masud90895
          filename: metrics/languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          committer_message: "chore(metrics): update languages [skip ci]"
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell
          extras_css: |
            svg { background-color: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            a, .link { color: #58a6ff; }

      # NOTE: the achievements plugin is not usable — it queries user.projects
      # (Projects classic), which GitHub has sunset, so the query returns
      # NOT_FOUND / user: null and the plugin renders "Unexpected error".
      # Isometric calendar is used for this slot instead.
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: masud90895
          filename: metrics/calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Dhaka
          committer_message: "chore(metrics): update calendar [skip ci]"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            svg { background-color: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            a, .link { color: #58a6ff; }
