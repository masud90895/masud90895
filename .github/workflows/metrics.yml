name: Generate Metrics

# Renders GitHub stats as a single SVG and commits it into this repo, so the
# README never depends on a third-party Vercel instance staying online.
#
# SETUP (one time):
#   1. Create a classic PAT at https://github.com/settings/tokens
#      Scope: read:user   (add repo    if you also want private-repo stats)
#   2. Add it as a repository secret named METRICS_TOKEN
#      Settings → Secrets and variables → Actions → New repository secret
#   3. Run this workflow once from the Actions tab (Run workflow)
#
# NOTE: the achievements plugin is deliberately not used — it queries
# user.projects (Projects classic), which GitHub has sunset, so the query
# returns NOT_FOUND / user: null and the plugin renders "Unexpected error".

on:
  schedule:
    - cron: "0 */12 * * *"   # Every 12 hours, same cadence as the snake
  workflow_dispatch:          # Manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # One combined card: profile + activity + community + repositories,
      # with the contribution calendar and language breakdown laid out in
      # columns. Three separate SVGs looked disjointed side by side.
      - name: Generate combined metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: masud90895
          filename: metrics/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
          config_display: columns
          config_padding: 0, 0
          committer_message: "chore(metrics): update card [skip ci]"

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell, liquid, procfile

          extras_css: |
            svg { background-color: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            a, .link { color: #58a6ff; }
